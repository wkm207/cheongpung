<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Country of Wind">
  <meta name="theme-color" content="#1c120b">
  <title>Country of Wind</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="game"></canvas>
  <div id="game-frame" aria-hidden="true"></div>

  <!-- 위: 퀘스트 알림 · 지역 표시줄 · 미니맵 -->
  <div id="topbar" hidden>
    <div id="quest-tracker"></div>
    <div class="zone-strip"><b id="hud-map"></b><span id="hud-coord"></span></div>
    <div class="minimap-box">
      <canvas id="minimap" width="150" height="112"></canvas>
      <div class="row" style="gap:3px"><button id="ride-toggle" class="tiny">🐎 말<kbd>R</kbd></button><button id="minimap-toggle" class="tiny">지도<kbd>N</kbd></button></div>
    </div>
  </div>

  <!-- 터치 전용: 이동(방향 버튼·조이스틱)과 공격 -->
  <div id="controls" hidden>
    <div id="move-zone">
      <div id="dpad">
        <span class="arrow up">▲</span><span class="arrow down">▼</span>
        <span class="arrow left">◀</span><span class="arrow right">▶</span>
      </div>
      <div id="joy-base"><div id="joy-knob"></div></div>
    </div>
    <button id="btn-attack" class="attack-btn">공격</button>
    <button id="btn-roll" class="roll-btn" aria-label="구르기">구르기</button>
  </div>

  <!-- 아래: 통합 조작판(상태 · 대화창 · 단축키 · 메뉴) -->
  <div id="console" hidden>
    <section class="status-panel">
      <canvas id="portrait" width="32" height="32"></canvas>
      <div class="status-lines">
        <div class="who"><b id="hud-name"></b><span id="hud-level"></span></div>
        <div class="stat-row"><span class="lbl">체력</span><div class="bar hp"><i></i></div><span class="num" id="hp-num"></span></div>
        <div class="stat-row"><span class="lbl">마력</span><div class="bar mp"><i></i></div><span class="num" id="mp-num"></span></div>
        <div class="stat-row"><span class="lbl">경험</span><div class="bar exp"><i></i></div><span class="num" id="exp-num"></span></div>
        <div class="gold">금전 <b id="hud-gold"></b></div>
      </div>
      <div class="orbs" aria-label="체력과 마력">
        <div class="orb hp" title="체력"><i></i><span class="orb-num" id="hp-orb"></span><span class="orb-lbl">체력</span></div>
        <div class="orb mp" title="마력"><i></i><span class="orb-num" id="mp-orb"></span><span class="orb-lbl">마력</span></div>
      </div>
    </section>

    <section class="chat-panel">
      <div id="log"></div>
      <form id="chat-form" autocomplete="off">
        <span class="chat-tag">대화</span>
        <input id="chat-input" maxlength="60" placeholder="Enter로 말하기 · /도움 으로 운영자 명령" enterkeyhint="send">
      </form>
    </section>

    <section class="right-panel">
      <div class="hotbar">
        <button class="slot skill" data-slot="0"></button>
        <button class="slot skill" data-slot="1"></button>
        <button class="slot skill" data-slot="2"></button>
        <button class="slot skill" data-slot="3"></button>
        <button class="slot skill" data-slot="4"></button>
        <button class="slot skill" data-slot="5"></button>
        <button class="slot skill" data-slot="6"></button>
        <button class="slot skill" data-slot="7"></button>
        <button class="slot skill" data-slot="8"></button>
        <button class="slot skill" data-slot="9"></button>
        <button class="slot quick" data-quick="hp"><span class="key">Q</span><span class="icon">🌿</span><small>0</small></button>
        <button class="slot quick" data-quick="mp"><span class="key">E</span><span class="icon">💧</span><small>0</small></button>
      </div>
      <nav class="menu-grid">
        <button data-open="inventory"><span class="ico">🎒</span><span>가방</span><kbd>I</kbd><i class="dot" id="badge-bag"></i></button>
        <button data-open="skills"><span class="ico">📖</span><span>기술</span><kbd>K</kbd><i class="dot" id="badge-skill"></i></button>
        <button data-open="character"><span class="ico">👤</span><span>정보</span><kbd>C</kbd></button>
        <button data-open="quests"><span class="ico">📜</span><span>퀘스트</span><kbd>L</kbd></button>
        <button data-open="menu"><span class="ico">⚙️</span><span>메뉴</span><kbd>M</kbd></button>
        <button data-open="gm" class="gm"><span class="ico">👑</span><span>GM</span><kbd>G</kbd></button>
      </nav>
    </section>
  </div>

  <!-- 넓은 화면: 오른쪽에 늘 붙어 있는 상태창(캐릭터·장비 칸·탭) -->
  <aside id="sidebar" hidden>
    <div class="side-card">
      <div class="side-who"><b id="side-name"></b><span id="side-title"></span></div>
      <div class="side-bars">
        <div class="sbar hp"><i id="side-hp"></i><span id="side-hp-text"></span></div>
        <div class="sbar mp"><i id="side-mp"></i><span id="side-mp-text"></span></div>
      </div>
      <div class="doll">
        <button class="doll-slot" data-doll="helmet"></button>
        <button class="doll-slot" data-doll="weapon"></button>
        <canvas id="doll-canvas" width="32" height="48"></canvas>
        <button class="doll-slot" data-doll="armor"></button>
        <button class="doll-slot" data-doll="necklace"></button>
        <button class="doll-slot" data-doll="ring"></button>
      </div>
    </div>
    <nav class="side-tabs">
      <button data-side="character">상태<kbd>C</kbd></button>
      <button data-side="inventory">가방<kbd>I</kbd></button>
      <button data-side="spells">마법<kbd>+</kbd></button>
      <button data-side="skills">기술<kbd>K</kbd></button>
      <button data-side="quests">퀘스트<kbd>L</kbd></button>
    </nav>
    <div id="side-layer"><div id="side-panel" class="panel side"></div></div>
  </aside>

  <div id="panel-layer" hidden><div id="panel" class="panel"></div></div>
  <div id="title" hidden></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
